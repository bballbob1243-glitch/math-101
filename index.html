<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 101</title><link rel="stylesheet" href="style.css"></head><body><main><h1>MATH 101</h1><p>3D Multiplayer Game Hub</p><input id="name" placeholder="Player name" maxlength="16"><select id="skin"><option value="blue">Blue Skin</option><option value="red">Red Skin</option><option value="green">Green Skin</option><option value="gold">Gold Skin</option></select><div class="cards"><button onclick="start('battle')">🎮 Battle Arena</button><button onclick="start('horror')">👻 Nightmare</button></div><p class="small">Up to 15 players • CPU-style placeholders • WASD / arrow keys</p></main><script>function start(mode){const n=document.getElementById('name').value||'Player';const skin=document.getElementById('skin').value;location.href=mode+'.html?name='+encodeURIComponent(n)+'&skin='+skin}</script></body></html>
