<!doctype html><html><head><meta charset="utf-8"><title>Nightmare</title><link rel="stylesheet" href="style.css"></head><body><div class="hud">👻 NIGHTMARE<br>WASD / Arrow Keys<br>Find the exit. Stay together.<br><button onclick="location.href='index.html'">Menu</button></div><script src="/socket.io/socket.io.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="game.js"></script><script>const scene=new THREE.Scene();scene.background=new THREE.Color(0x050508);const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);const r=new THREE.WebGLRenderer();r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);scene.add(new THREE.AmbientLight(0x555555,1));const light=new THREE.PointLight(0xffffff,4,18);scene.add(light);const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:0x15151b}));floor.rotation.x=-Math.PI/2;scene.add(floor);for(let i=-30;i<=30;i+=6){let w=new THREE.Mesh(new THREE.BoxGeometry(.7,4,70),new THREE.MeshStandardMaterial({color:0x24242c}));w.position.set(i,2,0);scene.add(w)}const meMesh=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),new THREE.MeshStandardMaterial({color:0x66ccff}));meMesh.position.y=1;scene.add(meMesh);const meshes=new Map();function loop(){requestAnimationFrame(loop);if(me){meMesh.position.set(me.x,1,me.z);light.position.set(me.x,3,me.z);cam.position.set(me.x,3,me.z+6);cam.lookAt(me.x,1,me.z)}for(const [id,p] of others){let m=meshes.get(id);if(!m){m=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),new THREE.MeshStandardMaterial({color:0xff4444}));scene.add(m);meshes.set(id,m)}m.position.set(p.x,1,p.z)}r.render(scene,cam)}loop();onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)}</script></body></html>
