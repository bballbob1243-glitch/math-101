<!doctype html><html><head><meta charset="utf-8"><title>Battle Arena</title><link rel="stylesheet" href="style.css"></head><body><div class="hud">🎮 BATTLE ARENA<br>WASD / Arrow Keys<br><span id="count">Players: 1/15</span> <button onclick="location.href='index.html'">Menu</button></div><script src="/socket.io/socket.io.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="game.js"></script><script>const scene=new THREE.Scene();scene.background=new THREE.Color(0x7aa6d8);const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));const floor=new THREE.Mesh(new THREE.BoxGeometry(80,1,80),new THREE.MeshStandardMaterial({color:0x385b38}));floor.position.y=-.5;scene.add(floor);const meMesh=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),new THREE.MeshStandardMaterial({color:0x3399ff}));meMesh.position.y=1;scene.add(meMesh);const meshes=new Map();function loop(){requestAnimationFrame(loop);if(me){meMesh.position.set(me.x,1,me.z);cam.position.set(me.x,7,me.z+9);cam.lookAt(me.x,1,me.z)}for(const [id,p] of others){let m=meshes.get(id);if(!m){m=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),new THREE.MeshStandardMaterial({color:p.skin==='red'?0xff4444:p.skin==='green'?0x44dd66:p.skin==='gold'?0xffcc33:0x3399ff}));scene.add(m);meshes.set(id,m)}m.position.set(p.x,1,p.z)}for(const [id,m] of meshes)if(!others.has(id)){scene.remove(m);meshes.delete(id)}document.getElementById('count').textContent='Players: '+(others.size+1)+'/15';r.render(scene,cam)}loop();onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)}</script></body></html>
